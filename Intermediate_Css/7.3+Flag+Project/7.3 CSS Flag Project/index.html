<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
   
    .flag{
      position: relative;
      height:600px;
      width:900px;
      background-color:#CE1126;
    }

    .flag>div{
      position:absolute;
      top:150px;
      height:300px;
      width:100%;
      background-color:#002868;
    }

   div.flag div div{
    height:200px;
    width:200px;
    background-color:white;
    border-radius:50%;
    position:absolute;
    left:350px;
    top:50px;
   }

   p{
    font-size:4rem;
    text-align: center;
    color:white;
    margin:0;
    padding:0;
   }

   div.flag>div>div>p{
    color:black;
   }

  </style>
</head>

<!-- https://appbrewery.github.io/flag-of-laos/ -->


<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
